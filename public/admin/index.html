<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Divyansh Garg — Portfolio CMS</title>
    <link rel="icon" type="image/svg+xml" href="/portfolio/favicon.svg" />
    <!-- Decap reads this path relative to the admin page at /portfolio/admin/. -->
    <link href="/portfolio/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #070b19;
        color: #e2e8f0;
      }
      #cms-load-error {
        max-width: 42rem;
        margin: 4rem auto;
        padding: 1.5rem;
        border: 1px solid rgba(248, 113, 113, 0.4);
        border-radius: 0.5rem;
        line-height: 1.5;
      }
      [class*="AppHeaderContent"] {
        background: linear-gradient(135deg, #070b19 0%, #0e1838 100%) !important;
        border-bottom: 1px solid rgba(56, 189, 248, 0.2) !important;
      }
      [class*="AppHeaderButton"] {
        color: #e2e8f0 !important;
      }
    </style>
  </head>
  <body>
    <div id="cms-load-error" role="alert" hidden>
      <strong>The CMS script could not be loaded.</strong>
      Check your network connection or CDN access, then reload this page.
    </div>
    <!-- Loaded from a pinned CDN URL at runtime; Decap auto-initializes from cms-config-url. -->
    <script
      src="https://unpkg.com/decap-cms@3.18.0/dist/decap-cms.js"
      integrity="sha384-Vu0vdYOBhK+2KywHCtNZ9sCqpzkwx358AT6pCSg8om/clLoDzpWYF41jrtEk/WMM"
      crossorigin="anonymous"
      onerror="document.getElementById('cms-load-error').hidden = false"
    ></script>
  </body>
</html>
